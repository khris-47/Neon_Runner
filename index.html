<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Neon Runner</title>
  <link rel="icon" type="image/svg+xml" href="/public/assets/images/Ico.png" />
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #0a0a1f;
      font-family: system-ui, -apple-system, sans-serif;
      color: #e0e0ff;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      /* Evita el zoom por doble tap y el rebote de scroll en iOS. */
      touch-action: manipulation;
      overscroll-behavior: none;
    }

    #app {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      /* Los gestos sobre el canvas los gestiona InputManager. Sin
       esto, el navegador intercepta los swipes para hacer scroll. */
      touch-action: none;
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
